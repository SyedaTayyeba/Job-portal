services:
  app:
    build:
      context: ./backend
    container_name: job-portal-app
    ports:
      - "8000:80"
    env_file:
      - ./backend/.env
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: job-portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: job_portal
      MYSQL_ROOT_PASSWORD: root
    # ports:
    #   - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: